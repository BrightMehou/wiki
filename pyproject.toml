[project]
name = "wiki"
version = "0.3.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "faker>=40.4.0",
    "fastapi[standard]>=0.142.0",
    "httpx2>=2.10.0",
    "pandas>=3.0.1",
    "psycopg[binary]>=3.3.3",
    "sqlalchemy>=2.1.0",
    "streamlit>=1.65.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.0",
]

[tool.ruff.lint]
select = ["E","F","I"]
ignore = ["E501"]
